[workspace]
resolver = "3"
members = [
    "rust/crates/diskplan-cli",
    "rust/crates/diskplan-core",
    "rust/crates/diskplan-proto",
    "rust/tools/generated-source-publish",
    "rust/tools/proto-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.31"
hex = "0.4.3"
insta = "=1.43.2"
libc = "=0.2.189"
prost = "=0.14.4"
prost-build = "=0.14.4"
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "=1.47.1", features = ["macros", "rt", "sync", "time"] }
