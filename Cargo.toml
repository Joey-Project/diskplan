[workspace]
resolver = "3"
members = [
    "rust/crates/diskplan-cli",
    "rust/crates/diskplan-core",
    "rust/crates/diskplan-proto",
    "rust/tools/generated-source-publish",
    "rust/tools/proto-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
hex = "0.4.3"
libc = "=0.2.189"
prost = "=0.14.4"
prost-build = "=0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
