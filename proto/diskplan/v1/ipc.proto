  PLAN_ACTION_KIND_GENERIC_REMOVE = 1;
  PLAN_ACTION_KIND_GIT_WORKTREE_REMOVE = 2;
  PLAN_ACTION_KIND_GIT_WORKTREE_DISCARD_LOCAL_CHANGES = 3;
