  PLAN_DISPOSITION_NEEDS_REVIEW = 3;
  PLAN_DISPOSITION_BLOCKED = 4;
  PLAN_DISPOSITION_KEEP_INFORMATIONAL = 5;
}

enum PlanActionKind {
