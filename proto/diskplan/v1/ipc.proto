  WAIVER_KIND_UNSPECIFIED = 0;
  WAIVER_KIND_RECENCY_AGE_POLICY = 1;
  WAIVER_KIND_STATIC_ONLY_REBUILD_EVIDENCE = 2;
  WAIVER_KIND_UNKNOWN_REBUILD_COST = 3;
  WAIVER_KIND_AGENT_ASSISTED_CLASSIFICATION = 4;
  WAIVER_KIND_TASK_SEMANTIC_COMPLETION = 5;
  WAIVER_KIND_DUPLICATE_SURVIVOR_CHOICE = 6;
  WAIVER_KIND_FULLY_OBSERVED_LOCAL_GIT_WORK_DISCARD = 7;
