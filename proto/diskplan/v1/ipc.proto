enum PathRaceProjection {
  PATH_RACE_PROJECTION_UNSPECIFIED = 0;
  PATH_RACE_PROJECTION_NONE_OBSERVED = 1;
  PATH_RACE_PROJECTION_RESIDUAL = 2;
  PATH_RACE_PROJECTION_UNKNOWN = 3;
}

message PlanRawPathProjection {
  OpaqueIdentifier root_id = 1;
  repeated bytes components = 2;
  string display_path = 3;
}

message PlanBlockerProjection {
  OpaqueIdentifier blocker_id = 1;
  PlanBlockerKind kind = 2;
  PlanBlockerDisposition disposition = 3;
  string code = 4;
  string summary = 5;
}

message PlanWaiverProjection {
  OpaqueIdentifier waiver_id = 1;
  WaiverKind kind = 2;
  string predicate = 3;
  string value_bucket = 4;
  Digest256 semantic_evidence_sha256 = 5;
  string summary = 6;
}

message PlanPrerequisiteProjection {
  OpaqueIdentifier action_id = 1;
  string summary = 2;
}

message EvidenceSummaryProjection {
  EvidenceStatus status = 1;
  string code = 2;
  string summary = 3;
}

enum EvidenceUnknownReasonProjection {
  EVIDENCE_UNKNOWN_REASON_PROJECTION_UNSPECIFIED = 0;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_NOT_REQUESTED = 1;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_UNSUPPORTED = 2;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_BUDGET_EXHAUSTED = 3;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_TIMED_OUT = 4;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_INCOMPLETE_COVERAGE = 5;
  EVIDENCE_UNKNOWN_REASON_PROJECTION_UNAVAILABLE_VIA_PUBLIC_API = 6;
}

// value_sha256 binds the engine-internal canonical evidence bytes. It is not a
// frontend input and the frontend must not recreate safety policy from it.
message EvidenceObservationProjection {
  EvidenceStatus status = 1;
  string code = 2;
  string summary = 3;
  EvidenceUnknownReasonProjection unknown_reason = 4;
  ObservationFailureProjection failure = 5;
  Digest256 value_sha256 = 6;
}

enum EvidenceCoverageCompletenessProjection {
  EVIDENCE_COVERAGE_COMPLETENESS_PROJECTION_UNSPECIFIED = 0;
  EVIDENCE_COVERAGE_COMPLETENESS_PROJECTION_COMPLETE = 1;
  EVIDENCE_COVERAGE_COMPLETENESS_PROJECTION_PARTIAL = 2;
}

enum EvidenceCoverageReasonProjection {
  EVIDENCE_COVERAGE_REASON_PROJECTION_UNSPECIFIED = 0;
  EVIDENCE_COVERAGE_REASON_PROJECTION_BUDGET_EXHAUSTED = 1;
  EVIDENCE_COVERAGE_REASON_PROJECTION_ACCESS_POLICY_CHANGED = 2;
  EVIDENCE_COVERAGE_REASON_PROJECTION_CANCELLED = 3;
  EVIDENCE_COVERAGE_REASON_PROJECTION_COLLECTOR_FAILED = 4;
  EVIDENCE_COVERAGE_REASON_PROJECTION_IDENTITY_MISMATCH = 5;
  EVIDENCE_COVERAGE_REASON_PROJECTION_MISSING = 6;
  EVIDENCE_COVERAGE_REASON_PROJECTION_MOUNT_BOUNDARY = 7;
  EVIDENCE_COVERAGE_REASON_PROJECTION_NOT_REQUESTED_BY_PROFILE = 8;
  EVIDENCE_COVERAGE_REASON_PROJECTION_PERMISSION_DENIED = 9;
  EVIDENCE_COVERAGE_REASON_PROJECTION_PROVIDER_METADATA_ONLY = 10;
  EVIDENCE_COVERAGE_REASON_PROJECTION_PROVIDER_STATE_UNVERIFIED = 11;
  EVIDENCE_COVERAGE_REASON_PROJECTION_SUBTREE_INCOMPLETE = 12;
  EVIDENCE_COVERAGE_REASON_PROJECTION_TIMED_OUT = 13;
  EVIDENCE_COVERAGE_REASON_PROJECTION_UNREADABLE = 14;
  EVIDENCE_COVERAGE_REASON_PROJECTION_UNSTABLE_DURING_SCAN = 15;
  EVIDENCE_COVERAGE_REASON_PROJECTION_USER_FINALIZED_PARTIAL = 16;
}

message EvidenceCoverageProjection {
  EvidenceCoverageCompletenessProjection completeness = 1;
  // Canonical enum order, unique, and capped at the complete closed reason set.
  repeated EvidenceCoverageReasonProjection reasons = 2;
  Digest256 binding_sha256 = 3;
}

enum EvidenceObjectKindProjection {
  EVIDENCE_OBJECT_KIND_PROJECTION_UNSPECIFIED = 0;
  EVIDENCE_OBJECT_KIND_PROJECTION_REGULAR = 1;
  EVIDENCE_OBJECT_KIND_PROJECTION_DIRECTORY = 2;
  EVIDENCE_OBJECT_KIND_PROJECTION_SYMBOLIC_LINK = 3;
  EVIDENCE_OBJECT_KIND_PROJECTION_OTHER = 4;
}

message EvidenceObjectIdentityProjection {
  uint64 device = 1;
  uint64 file_id = 2;
  EvidenceObjectKindProjection kind = 3;
  Digest256 binding_sha256 = 4;
}

message NamespaceAccessEvidenceProjection {
  EvidenceObservationProjection root_access_policy = 1;
  EvidenceObservationProjection root_acl_digest = 2;
  // The known value digest covers the ordered raw relative path, identity, and
  // access-policy seal of every ancestor. Individual path records stay inside
  // the engine; PlanTargetProjection remains the bounded raw-byte display path.
  EvidenceObservationProjection ancestor_access_policy_chain = 3;
  uint32 ancestor_count = 4;
  uint32 maximum_ancestor_count = 5;
  Digest256 namespace_binding_sha256 = 6;
  EvidenceObservationProjection target_access_policy = 7;
  EvidenceObservationProjection target_acl_digest = 8;
  // Exact root and terminal ancestor seal observations emitted by the scanner.
  EvidenceObservationProjection root_access_policy_seal = 9;
  EvidenceObservationProjection ancestor_access_policy_seal = 10;
}

enum ContentBaselineKindProjection {
  CONTENT_BASELINE_KIND_PROJECTION_UNSPECIFIED = 0;
  CONTENT_BASELINE_KIND_PROJECTION_REQUIRED_DIGEST = 1;
  CONTENT_BASELINE_KIND_PROJECTION_EXPLICITLY_NOT_APPLICABLE = 2;
}

enum ContentNotApplicableReasonProjection {
  CONTENT_NOT_APPLICABLE_REASON_PROJECTION_UNSPECIFIED = 0;
