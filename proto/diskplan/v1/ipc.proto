enum PlanRecoverability {
  PLAN_RECOVERABILITY_UNSPECIFIED = 0;
  PLAN_RECOVERABILITY_REBUILDABLE = 1;
  PLAN_RECOVERABILITY_RESTORABLE = 2;
  PLAN_RECOVERABILITY_IRRECOVERABLE = 3;
  PLAN_RECOVERABILITY_REVIEW_REQUIRED = 4;
