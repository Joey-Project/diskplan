message ExecutionUnitProjection {
  oneof unit {
    OpaqueIdentifier action_id = 1;
    CompoundReleaseUnitProjection compound_release = 2;
  }
}

message CompoundReleaseUnitProjection {
  repeated OpaqueIdentifier release_set_ids = 1;
}

enum ExecutionStepStatus {
  EXECUTION_STEP_STATUS_UNSPECIFIED = 0;
  EXECUTION_STEP_STATUS_SUCCEEDED = 1;
  EXECUTION_STEP_STATUS_PARTIALLY_SUCCEEDED = 2;
  EXECUTION_STEP_STATUS_FAILED = 3;
  EXECUTION_STEP_STATUS_CANCELLED = 4;
  EXECUTION_STEP_STATUS_EXPIRED = 5;
  EXECUTION_STEP_STATUS_SUPERSEDED = 6;
  EXECUTION_STEP_STATUS_SKIPPED_PREREQUISITE = 7;
}

enum ExecutionUnitStatus {
  EXECUTION_UNIT_STATUS_UNSPECIFIED = 0;
  EXECUTION_UNIT_STATUS_SUCCEEDED = 1;
  EXECUTION_UNIT_STATUS_PARTIALLY_FAILED = 2;
  EXECUTION_UNIT_STATUS_FAILED = 3;
  EXECUTION_UNIT_STATUS_CANCELLED = 4;
  EXECUTION_UNIT_STATUS_SKIPPED_PREREQUISITE = 5;
  EXECUTION_UNIT_STATUS_JIT_REJECTED = 6;
  EXECUTION_UNIT_STATUS_EXPIRED = 7;
  EXECUTION_UNIT_STATUS_SUPERSEDED = 8;
}

message ExecutionAdapterFailureProjection {
  string code = 1;
  int32 error_code = 2;
  bool has_error_code = 3;
  int32 exit_status = 4;
  bool has_exit_status = 5;
  int32 terminating_signal = 6;
  bool has_terminating_signal = 7;
}

enum AdapterOutcomeKind {
  ADAPTER_OUTCOME_KIND_UNSPECIFIED = 0;
  ADAPTER_OUTCOME_KIND_SUCCEEDED = 1;
  ADAPTER_OUTCOME_KIND_FAILED = 2;
  ADAPTER_OUTCOME_KIND_CANCELLED = 3;
  ADAPTER_OUTCOME_KIND_TIMED_OUT = 4;
  ADAPTER_OUTCOME_KIND_NOT_STARTED = 5;
}

message AdapterOutcomeProjection {
  AdapterOutcomeKind kind = 1;
  string detail_code = 2;
  oneof detail {
    ExecutionAdapterFailureProjection failure = 3;
    string not_started_reason = 4;
  }
}

enum PostVerificationKind {
  POST_VERIFICATION_KIND_UNSPECIFIED = 0;
  POST_VERIFICATION_KIND_SATISFIED = 1;
  POST_VERIFICATION_KIND_EXPECTED_RESIDUAL = 2;
  POST_VERIFICATION_KIND_MISSING = 3;
  POST_VERIFICATION_KIND_NOT_SATISFIED = 4;
  POST_VERIFICATION_KIND_UNKNOWN = 5;
  POST_VERIFICATION_KIND_UNREADABLE = 6;
  POST_VERIFICATION_KIND_FAILED = 7;
}

message PostVerificationProjection {
  PostVerificationKind kind = 1;
  string code = 2;
  oneof detail {
    ExecutionAdapterFailureProjection residual = 3;
    UnknownProjectionValue unknown = 4;
    ObservationFailureProjection observation_failure = 5;
  }
}

message ExecutionStepFinishedProjection {
  OpaqueIdentifier action_id = 1;
  ExecutionStepStatus status = 2;
  AdapterOutcomeProjection adapter_outcome = 3;
  PostVerificationProjection post_verification = 4;
}

message ReleasePostVerificationProjection {
  OpaqueIdentifier release_set_id = 1;
  PostVerificationProjection outcome = 2;
}

message AuditWriteFailureProjection {
  uint64 event_index = 1;
  string code = 2;
  int32 error_code = 3;
  bool has_error_code = 4;
}

message ApplyStartedProjection {
  ExecutionEpochProjection epoch = 1;
  OpaqueIdentifier apply_review_id = 2;
  OpaqueIdentifier projection_id = 3;
  Digest256 plan_sha256 = 4;
  OpaqueIdentifier overlay_id = 5;
  Digest256 overlay_sha256 = 6;
  Digest256 review_binding_sha256 = 7;
  uint64 selected_action_count = 8;
  OpaqueIdentifier plan_id = 9;
  OpaqueIdentifier evidence_id = 10;
  Digest256 evidence_sha256 = 11;
  Digest256 current_binding_sha256 = 12;
  Digest256 revalidation_sha256 = 13;
  uint64 overlay_revision = 14;
  OpaqueIdentifier scan_session_id = 15;
  OpaqueIdentifier scan_checkpoint_id = 16;
  Digest256 scan_checkpoint_evidence_sha256 = 17;
}

message UnitStartedProjection {
  ExecutionUnitProjection unit = 1;
}

message ForceRequiredWarningProjection {
  OpaqueIdentifier action_id = 1;
  ActionExecutionPreviewProjection preview = 2;
}

message UnitFinishedProjection {
  ExecutionUnitProjection unit = 1;
  ExecutionUnitStatus status = 2;
}

message UnitJITRejectedProjection {
  ExecutionUnitProjection unit = 1;
  RevalidationProjectionPayload revalidation = 2;
  reserved 3;
}

message UnitSkippedPrerequisiteProjection {
  ExecutionUnitProjection unit = 1;
  repeated ExecutionUnitProjection blocking_prerequisites = 2;
}

message ExecutionCancellationAcknowledgedProjection {
  string reason = 1;
}

enum ApplyStartFailureKind {
  APPLY_START_FAILURE_KIND_UNSPECIFIED = 0;
  APPLY_START_FAILURE_KIND_AUTHORIZATION_ALREADY_CLAIMED = 1;
  APPLY_START_FAILURE_KIND_INVALID_OVERLAY = 2;
  APPLY_START_FAILURE_KIND_MANIFEST_BINDING_MISMATCH = 3;
  APPLY_START_FAILURE_KIND_EXPIRED = 4;
  APPLY_START_FAILURE_KIND_INVALID_EXECUTION_GRAPH = 5;
  APPLY_START_FAILURE_KIND_PREPARATION_SUPERSEDED = 6;
  APPLY_START_FAILURE_KIND_FORCE_CONFIRMATION_BINDING_MISMATCH = 7;
}

message ApplyFinishedProjection {
  ApplyStartFailureKind start_failure = 1;
  uint64 unit_count = 2;
  uint64 succeeded_unit_count = 3;
  uint64 partial_unit_count = 4;
  uint64 failed_unit_count = 5;
  uint64 cancelled_unit_count = 6;
  uint64 skipped_unit_count = 7;
  uint64 audit_failure_count = 8;
  Digest256 execution_record_sha256 = 9;
  uint64 event_count = 10;
  uint64 encoded_event_bytes = 11;
  uint64 maximum_event_count = 12;
  uint64 maximum_encoded_event_bytes = 13;
  uint64 jit_rejected_unit_count = 14;
  uint64 expired_unit_count = 15;
  uint64 superseded_unit_count = 16;
  OpaqueIdentifier apply_review_id = 17;
  Digest256 review_binding_sha256 = 18;
}

message ExecutionStreamEvent {
  uint64 execution_event_index = 1;
  OpaqueIdentifier execution_id = 2;
  oneof body {
    ApplyStartedProjection apply_started = 10;
    UnitStartedProjection unit_started = 11;
    ForceRequiredWarningProjection force_required_warning = 12;
    ExecutionStepFinishedProjection step_finished = 13;
    ReleasePostVerificationProjection release_post_verification_finished = 14;
    UnitFinishedProjection unit_finished = 15;
    AuditWriteFailureProjection audit_write_failed = 16;
    ApplyFinishedProjection apply_finished = 17;
    UnitJITRejectedProjection unit_jit_rejected = 18;
    UnitSkippedPrerequisiteProjection unit_skipped_prerequisite = 19;
    ExecutionCancellationAcknowledgedProjection cancellation_acknowledged = 20;
  }
}

enum RuntimeRejectCode {
  RUNTIME_REJECT_CODE_UNSPECIFIED = 0;
  RUNTIME_REJECT_CODE_CAPABILITY_NOT_NEGOTIATED = 1;
  RUNTIME_REJECT_CODE_INVALID_STATE = 2;
  RUNTIME_REJECT_CODE_UNKNOWN_PROJECTION = 3;
  RUNTIME_REJECT_CODE_STALE_BINDING = 4;
  RUNTIME_REJECT_CODE_LIMIT_EXCEEDED = 5;
  RUNTIME_REJECT_CODE_REVALIDATION_FAILED = 6;
  RUNTIME_REJECT_CODE_CONFIRMATION_MISMATCH = 7;
  RUNTIME_REJECT_CODE_INTERNAL_ERROR = 8;
  RUNTIME_REJECT_CODE_BUSINESS_UNSUPPORTED = 9;
  RUNTIME_REJECT_CODE_MALFORMED_REQUEST = 10;
  RUNTIME_REJECT_CODE_DUPLICATE_REQUEST_ID = 11;
}

message RuntimeRejected {
  RuntimeRejectCode code = 1;
  string summary = 2;
}

message RuntimeEvent {
  uint64 event_sequence = 1;
  uint64 request_id = 2;
  OpaqueIdentifier runtime_session_id = 3;
  oneof body {
    BuildPlanAccepted build_plan_accepted = 10;
    PlanProjectionChunk plan_projection_chunk = 11;
    PlanProjection plan_projection = 12;
    PlanProjectionInvalidated plan_projection_invalidated = 13;
    DecisionOverlayAcknowledged decision_overlay_acknowledged = 14;
    DecisionOverlayRejected decision_overlay_rejected = 15;
    DryRunProjection dry_run_projection = 16;
    ApplyReviewProjection apply_review_projection = 17;
    ExecutionStreamEvent execution_stream_event = 18;
    RuntimeRejected runtime_rejected = 19;
  }
}

message ScanCancelled {
  string reason = 1;
}

message ScanFinished {
  string summary = 1;
}

message EngineFailed {
  string code = 1;
  string detail = 2;
}

message EngineEvent {
  uint64 event_sequence = 1;
  uint64 request_id = 2;
  string scan_session_id = 3;
  oneof body {
    ControlAccepted control_accepted = 10;
    ControlRejected control_rejected = 11;
    ScanStateChanged scan_state_changed = 12;
    ScanProgress scan_progress = 13;
    ProvisionalPlanReady provisional_plan_ready = 14;
    ProvisionalPlanInvalidated provisional_plan_invalidated = 15;
    ScanCancelled scan_cancelled = 16;
    ScanFinished scan_finished = 17;
    EngineFailed engine_failed = 18;
    ScanNodeObserved scan_node_observed = 19;
    ScanCheckpointReady scan_checkpoint_ready = 20;
    ScanFinalized scan_finalized = 21;
    ScanCheckpointChunk scan_checkpoint_chunk = 22;
  }
}

message Envelope {
  uint64 sequence = 1;
  oneof body {
    Hello hello = 10;
    HelloAccepted hello_accepted = 11;
    HelloRejected hello_rejected = 12;
    BusinessEnvelope business = 20;
    StartScanRequest start_scan_request = 21;
    ScanControlRequest scan_control_request = 22;
    EngineEvent engine_event = 23;
    BuildPlanRequest build_plan_request = 24;
    DecisionOverlayEditRequest decision_overlay_edit_request = 25;
    PrepareDryRunRequest prepare_dry_run_request = 26;
    PrepareApplyReviewRequest prepare_apply_review_request = 27;
    ConfirmApplyRequest confirm_apply_request = 28;
    CancelExecutionRequest cancel_execution_request = 29;
    RuntimeEvent runtime_event = 30;
  }
}
