message VersionedArtifactEvidenceProjection {
  // Raw authoritative identifier/component bytes. Producers must not derive
  // either field through lossy UTF-8 decoding or path normalization.
  OpaqueIdentifier artifact_kind_id = 1;
  OpaqueIdentifier version_id = 2;
  EvidenceObservationProjection inventory_coverage = 3;
  VersionedArtifactActiveStateProjection active_state = 4;
  VersionedArtifactSurvivorStateProjection survivor_state = 5;
  OpaqueIdentifier survivor_evidence_id = 6;
  uint64 observed_version_count = 7;
  uint64 active_version_count = 8;
  uint64 survivor_count = 9;
  uint64 maximum_version_count = 10;
  // SHA-256 of domain "diskplan/versioned-artifact-scan-evidence/v1\0" plus
  // exact per-version raw names/identities/metadata, selector/survivors,
  // collector identity, and budget binding retained by the Swift engine.
  Digest256 bundle_sha256 = 11;
  AdapterScopeProvenanceKindProjection provenance_kind = 12;
  OpaqueIdentifier configured_scope_id = 13;
  EvidenceObservationProjection provenance = 14;
  EvidenceObservationProjection install_root_identity = 15;
  EvidenceObjectIdentityProjection known_install_root_identity = 16;
  EvidenceObservationProjection active_selector = 17;
  EvidenceObjectIdentityProjection known_active_selector_identity = 18;
  // Exact single leaf bytes, at most 4 KiB, never decoded or normalized.
  bytes raw_active_selector_target = 19;
  EvidenceObservationProjection survivor_set = 20;
  // Digest of the canonical ordered raw survivor-name set; names are not sent.
  Digest256 survivor_set_sha256 = 21;
  uint64 metadata_complete_count = 22;
  EvidenceObservationProjection current_update_marker = 23;
  EvidenceCoverageProjection coverage = 24;
  bool current_update_in_progress = 25;
}

