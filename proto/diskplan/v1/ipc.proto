  PLAN_TARGET_KIND_UNKNOWN = 5;
}

enum PlanBlockerKind {
  PLAN_BLOCKER_KIND_UNSPECIFIED = 0;
  PLAN_BLOCKER_KIND_PROVIDER_MANAGED = 1;
  PLAN_BLOCKER_KIND_INCOMPLETE_EVIDENCE = 2;
  PLAN_BLOCKER_KIND_CURRENT_ACTIVITY = 3;
  PLAN_BLOCKER_KIND_IDENTITY_OR_ACCESS = 4;
  PLAN_BLOCKER_KIND_SEMANTIC_UNIQUENESS = 5;
  PLAN_BLOCKER_KIND_RECOVERABILITY = 6;
  PLAN_BLOCKER_KIND_DEPENDENCY = 7;
  PLAN_BLOCKER_KIND_PATH_RACE = 8;
  PLAN_BLOCKER_KIND_SNAPSHOT = 9;
  PLAN_BLOCKER_KIND_FORCE_REQUIRED = 10;
  PLAN_BLOCKER_KIND_UNSUPPORTED_ADAPTER = 11;
  PLAN_BLOCKER_KIND_PROTOCOL = 12;
